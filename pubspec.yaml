name: calsee_themes
description: "Calsee's seeded theme engine and renderers, shared by Calsee apps."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

# Fonts are app assets: every app bundles the families in
# lib/render/fonts.dart under the same names (see README.md).
dependencies:
  # 1.x on Flutter <3.38 (material_color_utilities 0.11), 2.x on newer.
  dynamic_color: ">=1.9.0 <3.0.0"
  flutter:
    sdk: flutter
  material_new_shapes: ^1.0.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ">=1.26.2 <2.0.0"
  # The newest release the running SDK supports (11 needs Dart 3.13).
  very_good_analysis: ">=9.0.0 <12.0.0"
