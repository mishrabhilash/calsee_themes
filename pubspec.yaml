name: calsee_themes
description: "Calsee's seeded theme engine and renderers, shared by Calsee apps."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

# Fonts are app assets: every app bundles the families in
# lib/render/fonts.dart under the same names (see README.md).
dependencies:
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  material_new_shapes: ^1.0.0
  material_ui: ^1.5.0
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.31.1
  very_good_analysis: ^11.0.0
