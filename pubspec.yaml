name: calsee_themes
description: >-
  Endless generated themes for Flutter apps: swipe for a new look in twelve
  families, with themed keys, backdrops and displays. From Calsee.
version: 1.1.0
homepage: https://calsee.tech
repository: https://github.com/mishrabhilash/calsee_themes
issue_tracker: https://github.com/mishrabhilash/calsee_themes/issues
topics:
  - theme
  - ui
  - design
  - widgets
  - animation

screenshots:
  - description: Twelve theme families on one kids' maths game.
    path: doc/families.png
  - description: Swiping between generated themes on a maths game.
    path: doc/swipe.gif
  - description: The Claymorphism family on a kids' maths game.
    path: doc/family_claymorphism.png
  - description: The Liquid Glass family on a kids' maths game.
    path: doc/family_liquidGlass.png
  - description: The Retro family on a kids' maths game.
    path: doc/family_retro.png
  - description: The Cyberpunk family on a kids' maths game.
    path: doc/family_cyberpunk.png
  - description: The Y2K Aero family on a kids' maths game.
    path: doc/family_y2kChrome.png
  - description: The Paper & Ink family on a kids' maths game.
    path: doc/family_paperInk.png
  - description: The Vaporwave family on a kids' maths game.
    path: doc/family_vaporwave.png
  - description: The Neo-brutalism family on a kids' maths game.
    path: doc/family_neoBrutalism.png

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  # 1.x on Flutter <3.38 (material_color_utilities 0.11), 2.x on newer.
  dynamic_color: ">=1.9.0 <3.0.0"
  flutter:
    sdk: flutter
  material_new_shapes: ^1.0.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ">=1.26.2 <2.0.0"
  # The newest release the running SDK supports (11 needs Dart 3.13).
  very_good_analysis: ">=9.0.0 <12.0.0"

# Bundled OFL fonts (fonts/README.md). Apps get them as
# `packages/calsee_themes/<family>` (lib/render/fonts.dart) and declare
# nothing themselves.
flutter:
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: fonts/roboto_flex/RobotoFlex.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: fonts/space_grotesk/SpaceGrotesk.ttf
    - family: Nunito
      fonts:
        - asset: fonts/nunito/Nunito.ttf
    - family: OpenSans
      fonts:
        - asset: fonts/open_sans/OpenSans.ttf
    - family: Newsreader
      fonts:
        - asset: fonts/newsreader/Newsreader.ttf
    - family: Oxanium
      fonts:
        - asset: fonts/oxanium/Oxanium.ttf
    - family: Anybody
      fonts:
        - asset: fonts/anybody/Anybody.ttf
    - family: Jost
      fonts:
        - asset: fonts/jost/Jost.ttf
    - family: PatrickHand
      fonts:
        - asset: fonts/patrick_hand/PatrickHand.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari/NotoSansDevanagari.ttf
    - family: CalseeSymbols
      fonts:
        - asset: fonts/calsee_symbols/CalseeSymbols.ttf
