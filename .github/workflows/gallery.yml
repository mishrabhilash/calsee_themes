# Builds the live gallery (example/lib/gallery.dart) for the web and
# publishes it to GitHub Pages: https://mishrabhilash.github.io/calsee_themes/
name: Gallery

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - fonts/**
      - pubspec.yaml
      - example/**
      - .github/workflows/gallery.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Build
        working-directory: example
        run: >-
          flutter build web --release -t lib/gallery.dart
          --base-href /calsee_themes/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
