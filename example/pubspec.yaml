name: calsee_themes_example
description: "Demo of calsee_themes: a payment keypad in endless themes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  calsee_themes:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=9.0.0 <12.0.0"

flutter:
  # The backspace key's icon, and the gallery's icons.
  uses-material-design: true
  # The gallery (lib/gallery.dart) shows these sources next to each example.
  assets:
    - lib/main.dart
    - lib/gallery/examples/
  fonts:
    # The gallery's code panels (fonts/roboto_mono/README.md).
    - family: RobotoMono
      fonts:
        - asset: fonts/roboto_mono/RobotoMono-Regular.ttf
